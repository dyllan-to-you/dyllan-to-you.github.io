  <h2 id="building">building</h2>

  <p>Playfaire studios, lifesaga.me, archiving one's own Lore, and maintaining my Verve. Open to contract and freelance work on the side — see <a href="/resume">résumé</a>.</p>

  <hr />

  <h2 id="thinking-about">thinking about</h2>

  <p>Global Protocols for Consent. How people and agents communicate and coordinate through shared representations instead of alongside each other. What falls out when you derive an ontology instead of designing one. Whether the psychonaut-systems-thinker-who-builds-formal-ontologies niche is a viable personal brand or just a very specific way to be unemployable.</p>

  <hr />

  <h2 id="listening-to">listening to</h2>

  <p>Looping, layering, deconstructing. Always building the next set.</p>

  <hr />

  <h2 id="reading">reading</h2>

  <p>Too many tabs. Not enough books.</p>
  <p>Dungeon Crawler Carl, Super Supportive, The Wandering Inn, Beware of Chicken</p>
