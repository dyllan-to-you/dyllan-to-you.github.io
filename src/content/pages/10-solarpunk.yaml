# Ends mid-sentence ("…a new Destiny for Humanity,") on purpose: pick up from there.
body: |-
  <p>I like to explain Solarpunk by first talking about Cyberpunk<br />
  My understanding of Cyberpunk is that in the 70s and 80s SciFi authors were looking at technology and looking at society, and trying to project forward what they thought society would look like in 40-50 years.</p>

  <p>Unfortunately, Manifestation is Real. By defining a cyberpunk future, they brought it into Reality. We are now living in that cyberpunk dystopia those SciFi writers were trying to warn us about.</p>

  <p>I see Solarpunk as a movement. A goal. To Manifest a new Destiny for Humanity,</p>
